# Context Keeper — deploy na Coolify ZA WŁASNYM reverse proxy (host nginx + Pangolin).
#
# Topologia:  internet → Pangolin (TLS + auth) → host nginx (routing) → 127.0.0.1:app
# Proxy Coolify NIE jest w tej ścieżce. Runbook: docs/deploy-coolify-nginx.md.
#
# Różnice vs docker-compose.coolify.yml (wariant pod WBUDOWANY proxy Coolify):
#   - `app` publikuje porty na `127.0.0.1` (`ports:`), zamiast `expose:` — żeby host nginx mógł
#     zrobić proxy_pass do 127.0.0.1:3000/3001. Bind na loopback = app NIEosiągalna z LAN/internetu
#     z pominięciem nginx/Pangolina (kluczowa kontrola bezpieczeństwa).
#   - BRAK magic-env `SERVICE_FQDN_APP_*` i BRAK domeny w Coolify UI — dzięki temu proxy Coolify
#     w ogóle nie dorzuca routera dla tego serwisu (routing robi Pangolin/nginx).
# Reszta jak w wariancie Coolify: TRUST_PROXY=true (tryb B), auto-migracja, provider=api @ 1024,
# sekrety bez defaultów (ustawiane w Coolify UI).
name: context-keeper

services:
  db:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-context_keeper}
    volumes:
      - pgdata:/var/lib/postgresql
    # DB NIGDY nie publikowany na host — tylko sieć dockerowa (app łączy się po DNS `db`).
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ck} -d ${POSTGRES_DB:-context_keeper}"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      # Kontekst = root monorepo. Plik leży w deploy/, więc `..`; Dockerfile jest relatywny do kontekstu.
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-ck}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-context_keeper}
      PORT_MCP: "3000"
      PORT_DASHBOARD: "3001"
      # Pangolin/Traefik i nginx terminują TLS upstream i przekazują X-Forwarded-* (tryb B, §9).
      TRUST_PROXY: "true"
      DB_AUTO_MIGRATE: "true"
      EMBEDDING_PROVIDER: "api"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: "1024"
      EMBEDDING_API_URL: ${EMBEDDING_API_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    # Publikacja TYLKO na loopback hosta — host nginx robi proxy_pass http://127.0.0.1:3000 / :3001.
    # NIE zmieniaj na "3000:3000" (0.0.0.0) — to wystawiłoby app publicznie z pominięciem Pangolina.
    ports:
      - "127.0.0.1:3000:3000"   # MCP + /health  (publiczny — za Pangolin/nginx)
      - "127.0.0.1:3001:3001"   # dashboard + /api (admin — za auth/SSO Pangolina)

volumes:
  pgdata:
