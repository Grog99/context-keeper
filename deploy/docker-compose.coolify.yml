# Context Keeper — deploy na Coolify (BUILD Z REPO, nie GHCR).
# Różnice vs docker-compose.yml:
#   - brak serwisu `proxy`/profilu edge-proxy — Coolify ma własny reverse-proxy (80/443)
#   - `expose:` zamiast `ports:` — nic nie publikujemy na hosta (Coolify routuje siecią dockerową)
#   - TRUST_PROXY=true — Coolify terminuje TLS upstream (tryb B, §9)
#   - dwie domeny dla dwóch portów jednego procesu (Coolify magic-env SERVICE_FQDN_APP_<port>)
#   - EMBEDDING_PROVIDER=api — sekrety ustawiane w UI Coolify (bez defaultów w compose)
#   - brak serwisu `migrate` — auto-migracja przy boot-cie appki (DB_AUTO_MIGRATE=true)
name: context-keeper

services:
  db:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-context_keeper}
    volumes:
      - pgdata:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ck} -d ${POSTGRES_DB:-context_keeper}"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      # Coolify uruchamia compose z `--project-directory <root repo>`, więc ścieżki względne
      # (kontekst budowania) liczą się od ROOTA repo, a NIE od katalogu tego pliku (deploy/).
      # Dlatego kontekst = `.` (root monorepo); `..` uciekłoby poza repo (błąd lstat /artifacts/apps).
      # Dockerfile jest relatywny do kontekstu.
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-ck}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-context_keeper}
      PORT_MCP: "3000"
      PORT_DASHBOARD: "3001"
      TRUST_PROXY: "true"
      DB_AUTO_MIGRATE: "true"
      # Dwie domeny (Coolify magic-env) dla jednego procesu, dwóch portów:
      SERVICE_FQDN_APP_3000: ${SERVICE_FQDN_APP_3000}   # publiczny: /mcp + /health
      SERVICE_FQDN_APP_3001: ${SERVICE_FQDN_APP_3001}   # admin: dashboard + /api
      EMBEDDING_PROVIDER: "api"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: "1024"
      EMBEDDING_API_URL: ${EMBEDDING_API_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      # Publiczny adres /mcp w `.mcp.json` (list_projects/create_project, ekran Onboarding) — ustaw
      # na domenę z SERVICE_FQDN_APP_3000 (ze schematem, np. https://ck-mcp.example.com).
      PUBLIC_MCP_URL: ${PUBLIC_MCP_URL:-}
      # Knoby z defaultami takimi jak w apps/server/src/config/env.ts — zadeklarowane jawnie, żeby
      # Coolify pokazał je w UI (Environment Variables) z wartością startową. Parytet ze schematem
      # pilnuje test/compose-env-parity.spec.ts.
      EMBEDDING_PRESET: ${EMBEDDING_PRESET:-}
      EMBEDDING_SAVE_TIMEOUT_MS: ${EMBEDDING_SAVE_TIMEOUT_MS:-1500}
      EMBEDDING_QUERY_TIMEOUT_MS: ${EMBEDDING_QUERY_TIMEOUT_MS:-800}
      RRF_K: ${RRF_K:-60}
      SEARCH_TOP_K: ${SEARCH_TOP_K:-10}
      SEARCH_VECTOR_CANDIDATES: ${SEARCH_VECTOR_CANDIDATES:-50}
      EVENT_DECAY_HALFLIFE_DAYS: ${EVENT_DECAY_HALFLIFE_DAYS:-30}
      GRAPH_BOOST_WEIGHT: ${GRAPH_BOOST_WEIGHT:-0.1}
      BODY_MAX_FACT: ${BODY_MAX_FACT:-8192}
      BODY_MAX_DOCUMENT: ${BODY_MAX_DOCUMENT:-262144}
      BODY_MAX_EVENT: ${BODY_MAX_EVENT:-8192}
      TAGS_MAX: ${TAGS_MAX:-10}
      TAG_MAX_LEN: ${TAG_MAX_LEN:-40}
      NEAR_DUPLICATE_DISTANCE: ${NEAR_DUPLICATE_DISTANCE:-0.2} # 0.2 = bge-m3; text-embedding-3-small → 0.13
      NIGHTLY_DEDUP_DISTANCE: ${NIGHTLY_DEDUP_DISTANCE:-0.05}
      NIGHTLY_CONFLICT_DISTANCE: ${NIGHTLY_CONFLICT_DISTANCE:-0.23} # 0.23 = bge-m3; text-embedding-3-small → 0.21
      NIGHTLY_ANN_NEIGHBORS: ${NIGHTLY_ANN_NEIGHBORS:-5}
      NIGHTLY_BATCH_SIZE: ${NIGHTLY_BATCH_SIZE:-50}
      NIGHTLY_PRUNE_MIN_AGE_DAYS: ${NIGHTLY_PRUNE_MIN_AGE_DAYS:-30}
      NIGHTLY_PRUNE_STALE_DAYS: ${NIGHTLY_PRUNE_STALE_DAYS:-90}
      NIGHTLY_PRUNE_MAX_ACCESS: ${NIGHTLY_PRUNE_MAX_ACCESS:-0}
      NIGHTLY_MAX_PROPOSALS_PER_RUN: ${NIGHTLY_MAX_PROPOSALS_PER_RUN:-200}
      SEARCH_EVENTS_RETENTION_DAYS: ${SEARCH_EVENTS_RETENTION_DAYS:-90}
      TOKEN_GRACE_PERIOD_HOURS: ${TOKEN_GRACE_PERIOD_HOURS:-72}
      RATE_LIMIT_SAVE_PER_MIN: ${RATE_LIMIT_SAVE_PER_MIN:-20}
      RATE_LIMIT_SEARCH_PER_MIN: ${RATE_LIMIT_SEARCH_PER_MIN:-120}
      RATE_LIMIT_GET_PER_MIN: ${RATE_LIMIT_GET_PER_MIN:-240}
      RATE_LIMIT_CREATE_PROJECT_PER_MIN: ${RATE_LIMIT_CREATE_PROJECT_PER_MIN:-3}
      RATE_LIMIT_MCP_IP_PER_MIN: ${RATE_LIMIT_MCP_IP_PER_MIN:-300}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      DASHBOARD_COOKIE_NAME: ${DASHBOARD_COOKIE_NAME:-ck_session}
      # Opcjonalny: klucz szyfrujący sekrety w bazie (klucz API modelu LLM z Ustawień). `openssl rand -base64 32`.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
    expose:
      - "3000"
      - "3001"

volumes:
  pgdata:
