name: context-keeper

services:
  db:
    # Backup (NFR-5, Faza 7): `infra/backup.sh` woła `pg_dump` WEWNĄTRZ tego kontenera
    # (docker compose exec -T db ...) — zgodność wersji klient/serwer za darmo. Dumpy lądują
    # na hoście w BACKUP_DIR (domyślnie ./backups, poza tym volumem) — patrz README "Backup / Restore".
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ck}
      POSTGRES_DB: ${POSTGRES_DB:-context_keeper}
    volumes:
      # PG18+ zmienił konwencję: pojedyncze montowanie w /var/lib/postgresql
      # (dane lądują w podkatalogu wersji), NIE /var/lib/postgresql/data jak w ≤17.
      - pgdata:/var/lib/postgresql
    ports:
      # Bind TYLKO do 127.0.0.1 (nie 0.0.0.0) — Postgres dostępny lokalnie dla dev/migracji z hosta,
      # ale NIGDY nie wystawiony na publiczny interfejs (review bezpieczeństwa E1: default hasło ck/ck
      # + publiczny 5432 = baza w internecie). W sieci compose `app` i tak łączy się po `db:5432`.
      # W produkcji ustaw mocne POSTGRES_PASSWORD (.env) i rozważ całkowite usunięcie tej publikacji.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ck} -d ${POSTGRES_DB:-context_keeper}"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # DATABASE_URL składany z części — zawsze celuje w serwis `db` w sieci compose
      # (niezależnie od DATABASE_URL w .env, które służy dev-owi na hoście).
      DATABASE_URL: postgres://${POSTGRES_USER:-ck}:${POSTGRES_PASSWORD:-ck}@db:5432/${POSTGRES_DB:-context_keeper}
      PORT_MCP: "3000"
      PORT_DASHBOARD: "3001"
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      # Nazwa serwisu `embeddings` w sieci compose — działa TYLKO gdy profil `local-embeddings`
      # jest włączony (COMPOSE_PROFILES); przy provider=api sidecar się nie podnosi i ten URL jest nieużywany.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embeddings:80}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_SAVE_TIMEOUT_MS: ${EMBEDDING_SAVE_TIMEOUT_MS:-1500}
      EMBEDDING_QUERY_TIMEOUT_MS: ${EMBEDDING_QUERY_TIMEOUT_MS:-800}
      EMBEDDING_PRESET: ${EMBEDDING_PRESET:-}
      # Obraz NIE zawiera `.env` (.dockerignore), a ten serwis nie ma `env_file` — do kontenera trafia
      # WYŁĄCZNIE ta lista. Każda zmienna czytana przez appkę (apps/server/src/config/env.ts) musi tu
      # być, z tym samym defaultem co w schemacie; pilnuje tego test/compose-env-parity.spec.ts.
      RRF_K: ${RRF_K:-60}
      SEARCH_TOP_K: ${SEARCH_TOP_K:-10}
      SEARCH_VECTOR_CANDIDATES: ${SEARCH_VECTOR_CANDIDATES:-50}
      EVENT_DECAY_HALFLIFE_DAYS: ${EVENT_DECAY_HALFLIFE_DAYS:-30}
      GRAPH_BOOST_WEIGHT: ${GRAPH_BOOST_WEIGHT:-0.1}
      BODY_MAX_FACT: ${BODY_MAX_FACT:-8192}
      BODY_MAX_DOCUMENT: ${BODY_MAX_DOCUMENT:-262144}
      BODY_MAX_EVENT: ${BODY_MAX_EVENT:-8192}
      TAGS_MAX: ${TAGS_MAX:-10}
      TAG_MAX_LEN: ${TAG_MAX_LEN:-40}
      TOKEN_GRACE_PERIOD_HOURS: ${TOKEN_GRACE_PERIOD_HOURS:-72}
      RATE_LIMIT_SAVE_PER_MIN: ${RATE_LIMIT_SAVE_PER_MIN:-20}
      RATE_LIMIT_SEARCH_PER_MIN: ${RATE_LIMIT_SEARCH_PER_MIN:-120}
      RATE_LIMIT_GET_PER_MIN: ${RATE_LIMIT_GET_PER_MIN:-240}
      RATE_LIMIT_CREATE_PROJECT_PER_MIN: ${RATE_LIMIT_CREATE_PROJECT_PER_MIN:-3}
      RATE_LIMIT_MCP_IP_PER_MIN: ${RATE_LIMIT_MCP_IP_PER_MIN:-300}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      DASHBOARD_COOKIE_NAME: ${DASHBOARD_COOKIE_NAME:-ck_session}
      # Publiczny adres /mcp w `.mcp.json` (list_projects/create_project, ekran Onboarding).
      # ACME_DOMAIN to fallback dla trybu A — tu BEZ defaultu `:80` z serwisu `proxy`, żeby pusta
      # wartość dawała placeholder, a nie `https://:80`.
      PUBLIC_MCP_URL: ${PUBLIC_MCP_URL:-}
      ACME_DOMAIN: ${ACME_DOMAIN:-}
      # Klucz szyfrujący sekrety w bazie (klucz API modelu LLM z Ustawień) — opcjonalny, generuje go install.sh.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      NEAR_DUPLICATE_DISTANCE: ${NEAR_DUPLICATE_DISTANCE:-0.2} # 0.2 = bge-m3; text-embedding-3-small → 0.13
      NIGHTLY_CRON: ${NIGHTLY_CRON:-0 3 * * *}
      NIGHTLY_TZ: ${NIGHTLY_TZ:-Europe/Warsaw}
      NIGHTLY_DEDUP_DISTANCE: ${NIGHTLY_DEDUP_DISTANCE:-0.05}
      NIGHTLY_CONFLICT_DISTANCE: ${NIGHTLY_CONFLICT_DISTANCE:-0.23} # 0.23 = bge-m3; text-embedding-3-small → 0.21
      NIGHTLY_ANN_NEIGHBORS: ${NIGHTLY_ANN_NEIGHBORS:-5}
      NIGHTLY_BATCH_SIZE: ${NIGHTLY_BATCH_SIZE:-50}
      NIGHTLY_PRUNE_MIN_AGE_DAYS: ${NIGHTLY_PRUNE_MIN_AGE_DAYS:-30}
      NIGHTLY_PRUNE_STALE_DAYS: ${NIGHTLY_PRUNE_STALE_DAYS:-90}
      NIGHTLY_PRUNE_MAX_ACCESS: ${NIGHTLY_PRUNE_MAX_ACCESS:-0}
      NIGHTLY_MAX_PROPOSALS_PER_RUN: ${NIGHTLY_MAX_PROPOSALS_PER_RUN:-200}
      SEARCH_EVENTS_RETENTION_DAYS: ${SEARCH_EVENTS_RETENTION_DAYS:-90}
    ports:
      # Bind TYLKO do 127.0.0.1 (nie 0.0.0.0) — review bezpieczeństwa E2: w trybie `edge-proxy`
      # Caddy sięga `app:3000/3001` po sieci compose (host-publish zbędny); w trybie bring-your-own-proxy
      # host-owy nginx/reverse-proxy dobija do 127.0.0.1:3000/3001. Publikacja na 0.0.0.0 wystawiałaby
      # dashboard/admin (3001) wprost na IP hosta, omijając model "admin za proxy/VPN".
      # Lewa strona = port na hoście (zmień PORT_MCP/PORT_DASHBOARD w .env gdy 3000/3001 zajęte).
      - "127.0.0.1:${PORT_MCP:-3000}:3000"
      - "127.0.0.1:${PORT_DASHBOARD:-3001}:3001"

  # Sidecar lokalnych embeddingów (TEI/bge-m3). Startuje tylko przy profilu `local-embeddings`.
  # UWAGA: realne wpięcie app → embeddings dochodzi w Fazie 3; tu tylko scaffold.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    profiles: ["local-embeddings"]
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3"]
    volumes:
      - tei-data:/data

  # Bundled edge (tryb A). Startuje tylko przy profilu `edge-proxy`.
  # Off = bring-your-own-proxy (homelab) — wtedy ustaw TRUST_PROXY=true (§9).
  proxy:
    image: caddy:2.11-alpine
    profiles: ["edge-proxy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Porty na hoście — zmień HTTP_PORT/HTTPS_PORT w .env gdy 80/443 są zajęte
      # (np. inny reverse-proxy już nasłuchuje). Prawa strona = port w kontenerze (stały).
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # Pusty ACME_DOMAIN -> lokalny fallback ":80" (HTTP). Domena -> auto-HTTPS (Let's Encrypt).
      ACME_DOMAIN: ${ACME_DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  tei-data:
  caddy-data:
  caddy-config:
